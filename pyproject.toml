[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "myagent"
version = "0.9.0"
description = "招聘信息日报 Agent —— 手写 ReAct 循环的学习型项目"
readme = "README.md"
requires-python = ">=3.11"

# 依赖刻意精简：不用 tenacity/backoff（手写退避）、不用 langchain（手写 ReAct）、
# 不用 apscheduler（部署走 Windows 任务计划程序，见 docs/ADR/001）。
dependencies = [
    "openai>=1.60",        # OpenAI 兼容协议客户端（tool calling 的地基）
    "httpx>=0.27",         # 原生 HTTP：工具层直接抓取 + 测试时可被 mock
    "pydantic>=2.9",       # 从类型注解自动生成工具参数的 JSON Schema
    "python-dotenv>=1.0",  # 加载 .env
    "structlog>=24.4",     # 结构化日志（M6 可观测）
    "playwright>=1.48",    # 半自动登录：有头浏览器人工过一次验证码（M2）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",         # mock httpx 请求，让工具层可脱离网络做单测（M7）
    "ruff>=0.7",           # lint + format
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
